[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgepersona"
version = "0.1.0"
description = "Real-time personalization engine / Edge CDP"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "fastapi>=0.95",
    "uvicorn>=0.21",
    "pydantic>=2.0",
    "redis>=4.5",
    "orjson>=3.8",
    "scikit-learn>=1.2",
]
optional-dependencies = { rust = ["maturin>=1.0"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
